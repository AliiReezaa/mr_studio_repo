# Week-1 prototype pipeline: builds the relocatable R runtime, runs the contract
# and connection tests with it, builds the desktop installers, smoke-tests the
# installed app, and compares results across operating systems (contracts C8.6).
# Runs only when started by hand (Actions tab -> Run workflow) or on a v* tag,
# to save build minutes.
# Installers and test reports go to a pre-release of this run (tag build-<run number>, or the
# v* tag itself) instead of workflow artifacts: release files do not count toward the
# Actions artifact storage quota.
name: prototype

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the run's pre-release and attach the installers to it

# Budget guards (the repository is private, so hosted-runner minutes draw on the monthly allowance;
# a macOS minute costs about 6 Windows minutes): one run at a time, and a second click cancels the older run.
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

env:
  REL_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the pre-release for this run
        run: |
          gh release view "$REL_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$REL_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Build $REL_TAG" \
              --notes "Installers and test reports of workflow run ${{ github.run_number }} (commit ${GITHUB_SHA::7})."

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        id: macos-arm64 }
          - { os: macos-15-intel,  id: macos-x64 }
          - { os: windows-latest,  id: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # longest job so far took 24 minutes; a hung macOS job stops here instead of after 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: bash
          post-cleanup: none
          # Round 72b: run 44748712659 failed on Intel Mac when one conda-forge download timed out after 30 s. Longer timeouts and more
          # retries, with back-off, for every package download of this job.
          condarc: |
            remote_connect_timeout_secs: 60
            remote_read_timeout_secs: 120
            remote_max_retries: 6
            remote_backoff_factor: 3

      - name: Build R runtime, then move it (relocation test)
        run: |
          # up to three attempts, each from a clean folder, so a download that still fails after the retries above does not end the build
          for attempt in 1 2 3; do
            micromamba create -y -p "$RUNNER_TEMP/build_runtime" -f prototype/ci/runtime.yml && break
            [ "$attempt" = 3 ] && { echo "the R runtime could not be built after 3 attempts"; exit 1; }
            echo "attempt $attempt failed; trying again in 60 s"; rm -rf "$RUNNER_TEMP/build_runtime"; sleep 60
          done
          # Round 65: mixtools (import of lhcMR) from conda-forge where it is built; on macOS arm64 it is built from source later.
          if [[ "${{ matrix.id }}" != "macos-arm64" ]]; then micromamba install -y -p "$RUNNER_TEMP/build_runtime" -c conda-forge r-mixtools; fi
          micromamba env export -p "$RUNNER_TEMP/build_runtime" --explicit > "runtime-lock-${{ matrix.id }}.txt"
          rm -f prototype/runtime/README.txt
          mv "$RUNNER_TEMP/build_runtime"/* prototype/runtime/
          du -sh prototype/runtime | tee "size-${{ matrix.id }}.txt"

      - name: Make the macOS runtime relocatable
        if: runner.os == 'macOS'
        run: python3 prototype/ci/relocate_macos.py "$RUNNER_TEMP/build_runtime" "$PWD/prototype/runtime"

      - name: Locate R
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Runtime top level:"; ls -la prototype/runtime | head -40
            RTERM="$(find "$PWD/prototype/runtime" -iname Rterm.exe | grep -i x64 | head -1 || true)"
            if [[ -z "$RTERM" ]]; then
              echo "Rterm.exe not found. Candidates:"; find "$PWD/prototype/runtime" -maxdepth 4 -iname 'R*.exe' | head -20
              exit 1
            fi
            RBIN="$(cygpath -m "$RTERM")"
            RH="$(dirname "$(dirname "$(dirname "$RBIN")")")"
            echo "Found R at $RBIN (R_HOME $RH)"
          else
            RH="$PWD/prototype/runtime/lib/R"; RBIN="$RH/bin/exec/R"
          fi
          echo "R_HOME=$RH" >> "$GITHUB_ENV"
          echo "R_SHARE_DIR=$RH/share" >> "$GITHUB_ENV"
          echo "R_INCLUDE_DIR=$RH/include" >> "$GITHUB_ENV"
          echo "R_DOC_DIR=$RH/doc" >> "$GITHUB_ENV"
          echo "RBIN=$RBIN" >> "$GITHUB_ENV"
          echo "CTDIR=$( [[ "$RUNNER_OS" == "Windows" ]] && cygpath -m "$RUNNER_TEMP/ct" || echo "$RUNNER_TEMP/ct" )" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            RTW="$(cygpath -w "$PWD/prototype/runtime")"
            echo "$RTW" >> "$GITHUB_PATH"
            echo "$RTW\\Library\\bin" >> "$GITHUB_PATH"
            echo "$RTW\\Library\\mingw-w64\\bin" >> "$GITHUB_PATH"
            echo "$RTW\\Library\\usr\\bin" >> "$GITHUB_PATH"
            echo "$(cygpath -w "$(dirname "$RTERM")")" >> "$GITHUB_PATH"
          fi
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" != "Windows" ]]; then echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"; fi
          export R_HOME="$RH" R_SHARE_DIR="$RH/share" R_INCLUDE_DIR="$RH/include" R_DOC_DIR="$RH/doc"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            RT="$PWD/prototype/runtime"
            export PATH="$RT:$RT/Library/bin:$RT/Library/mingw-w64/bin:$RT/Library/usr/bin:$(dirname "$RTERM"):$PATH"
            echo "RBIN: $RBIN"; ls -la "$RTERM" || true
            echo "Dirs in runtime:"; find "$RT" -maxdepth 2 -type d | head -40
          fi
          set +e
          "$RBIN" --no-echo --vanilla -e 'cat(R.version.string, "\n"); print(extSoftVersion()[c("BLAS","PCRE")])'
          RC=$?
          echo "R exit code: $RC"
          exit $RC

      # Pinned sources of the MR packages that are not on conda-forge or CRAN for this R.
      # TwoSampleMR is the commit the reference adapters were written against (contracts C6).
      # A change to any commit here changes results provenance: update the adapters' `packages` too.
      - uses: actions/checkout@v7
        with: { repository: MRCIEU/TwoSampleMR, ref: 5e93ee7d8e1f67581acb8134299759389d73efba, path: _pinned/twosamplemr }
      - uses: actions/checkout@v7
        with: { repository: gqi/MRMix, ref: 56afdb2bc96760842405396f5d3f02e60e305039, path: _pinned/mrmix }
      - uses: actions/checkout@v7
        with: { repository: rondolab/MR-PRESSO, ref: 3e3c92d7eda6dce0d1d66077373ec0f7ff4f7e87, path: _pinned/mrpresso }
      - uses: actions/checkout@v7
        with: { repository: WSpiller/RadialMR, ref: 7ca35c052489001890347871e38998ca53a02b03, path: _pinned/radialmr }
      - uses: actions/checkout@v7
        with: { repository: qingyuanzhao/mr.raps, ref: dd79b5bd74d10b699503cdd226d70c726f11c796, path: _pinned/mrraps }
      # Round 64: GenomicSEM (LD score regression). Round 63: MRcML, MRCD and BiDirectCausal (bidirectional MR-cML).
      - uses: actions/checkout@v7
        with: { repository: GenomicSEM/GenomicSEM, ref: da95d431a4709693d07eae55e172ade55526948b, path: _pinned/genomicsem }
      - uses: actions/checkout@v7
        with: { repository: xue-hr/MRcML, ref: 58a3481976093175cbb82a5e6bf06c10e3c576f2, path: _pinned/mrcml }
      - uses: actions/checkout@v7
        with: { repository: xue-hr/MRCD, ref: 11ca09599063ac236ba66c0307aa1186aebb0cad, path: _pinned/mrcd }
      - uses: actions/checkout@v7
        with: { repository: xue-hr/BiDirectCausal, ref: b463ff10621a700ad72d28337135e1a799229812, path: _pinned/bidirectcausal }
      - uses: actions/checkout@v7   # Round 65: LHC-MR
        with: { repository: LizaDarrous/lhcMR, ref: aee7f348744dc7be8b4e7cd52d645ee225cd8b95, path: _pinned/lhcmr }
      - uses: actions/checkout@v7   # Round 68: MRlap
        with: { repository: n-mounier/MRlap, ref: 660f026864f8bfbbad5a8206bdff7d58f5d5d05b, path: _pinned/mrlap }
      - uses: actions/checkout@v7   # Round 69: MR-APSS
        with: { repository: YangLabHKUST/MR-APSS, ref: 85c18eaef8ccbc1b330d31db0b3984c2fd0f528f, path: _pinned/mrapss }
      - uses: actions/checkout@v4   # Round 70: CAUSE (GPL >= 2), compiled
        with: { repository: jean997/cause, ref: 6257e6c66e6c1518c8750d1e4d2b4d6e42644fa5, path: _pinned/cause }

      - name: Install the pinned MR packages into the runtime
        run: |
          pp() { if [[ "$RUNNER_OS" == "Windows" ]]; then cygpath -m "$PWD/_pinned/$1"; else echo "$PWD/_pinned/$1"; fi; }
          export PK_MRMIX="$(pp mrmix)" PK_MRPRESSO="$(pp mrpresso)" PK_RADIALMR="$(pp radialmr)" PK_MRRAPS="$(pp mrraps)" PK_TWOSAMPLEMR="$(pp twosamplemr)"
          export PK_GENOMICSEM="$(pp genomicsem)" PK_MRCML="$(pp mrcml)" PK_MRCD="$(pp mrcd)" PK_BIDIRECTCAUSAL="$(pp bidirectcausal)" PK_LHCMR="$(pp lhcmr)" PK_MRLAP="$(pp mrlap)" PK_MRAPSS="$(pp mrapss)" PK_CAUSE="$(pp cause)"
          python prototype/ci/patch_mrraps.py _pinned/mrraps   # drops the rsnps import (optional plot annotation only; no osx-arm64 build)
          # simex 1.8 (Round 41): downloaded with the runner's curl, because the relocated R cannot reach its SSL
          # certificates at this step on macOS; R checks the SHA-256 before installing it.
          SX="$RUNNER_TEMP/simex_1.8.tar.gz"
          curl -fsSL -o "$SX" https://cran.r-project.org/src/contrib/simex_1.8.tar.gz || \
            curl -fsSL -o "$SX" https://cran.r-project.org/src/contrib/Archive/simex/simex_1.8.tar.gz
          if [[ "$RUNNER_OS" == "Windows" ]]; then SX="$(cygpath -m "$SX")"; fi
          export PK_SIMEX="$SX"
          SS="$RUNNER_TEMP/simsalapar_1.0-13.tar.gz"   # Round 64: import of GenomicSEM, not on conda-forge
          curl -fsSL -o "$SS" https://cran.r-project.org/src/contrib/simsalapar_1.0-13.tar.gz || \
            curl -fsSL -o "$SS" https://cran.r-project.org/src/contrib/Archive/simsalapar/simsalapar_1.0-13.tar.gz
          if [[ "$RUNNER_OS" == "Windows" ]]; then SS="$(cygpath -m "$SS")"; fi
          export PK_SIMSALAPAR="$SS"
          MX="$RUNNER_TEMP/mixtools_2.0.0.1.tar.gz"   # Round 65: built from source only on macOS arm64 (no conda-forge build there)
          curl -fsSL -o "$MX" https://cran.r-project.org/src/contrib/mixtools_2.0.0.1.tar.gz || \
            curl -fsSL -o "$MX" https://cran.r-project.org/src/contrib/Archive/mixtools/mixtools_2.0.0.1.tar.gz
          if [[ "$RUNNER_OS" == "Windows" ]]; then MX="$(cygpath -m "$MX")"; fi
          export PK_MIXTOOLS="$MX"
          # Round 65: compilers for the packages built from source on macOS (mixtools on arm64, MRCD on both): the runtime has none
          # (run 44577398117: arm64-apple-darwin20.0.0-clang not found). Installed after the relocation test, into the moved runtime;
          # the trim step below removes them before packaging.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            micromamba install -y -p "$PWD/prototype/runtime" -c conda-forge c-compiler cxx-compiler fortran-compiler
            export PATH="$PWD/prototype/runtime/bin:$PATH" SDKROOT="$(xcrun --show-sdk-path)"
            # R's build settings still name the build location (run 44591943858: ld: library not found for -lR, -L.../build_runtime/lib);
            # relocate_macos.py rewrites only the launcher and ldpaths, so Makeconf is pointed at the moved runtime here.
            sed -i '' "s|$RUNNER_TEMP/build_runtime|$PWD/prototype/runtime|g" prototype/runtime/lib/R/etc/Makeconf
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            RT="$PWD/prototype/runtime"
            # Round 70d-f: R passes its compile and link settings to make in single quotes, which only an MSYS-based make reads, and its
            # link rule builds the export list with sed and other POSIX tools. The runtime has none of these (run 44724590284: native make
            # kept the quotes). Installing m2-make into the runtime itself (run 44733842418) put a partial MSYS2 system (bash, /etc/profile)
            # into the activated environment, and every later shell step lost cp, mkdir and python (exit 127). The MSYS2 tools therefore go
            # into a separate folder of the runner, outside the runtime that is shipped, and are on the PATH only for this step.
            BT="$RUNNER_TEMP/msys-tools"
            micromamba create -y -p "$BT" -c conda-forge m2-make m2-bash m2-coreutils m2-sed m2-grep m2-gawk
            export PATH="$RT:$RT/Library/bin:$RT/Library/mingw-w64/bin:$RT/Library/usr/bin:$(dirname "$RBIN"):$PATH"
            MK="$BT/Library/usr/bin/make.exe"; [ -f "$MK" ] || { echo "m2-make did not install make.exe"; exit 1; }
            export MAKE="$(cygpath -m "$MK")"; echo "MAKE=$MAKE"
            # The tools come first on the PATH of the R process only (MSYS_FIRST below), so make and the shell and sed it starts all use
            # the same MSYS2 runtime; this shell keeps Git's tools (two MSYS2 runtimes must not start each other).
            MSYS_FIRST="$BT/Library/usr/bin"
            [ ! -f "$RT/Library/usr/bin/bash.exe" ] || { echo "the runtime must not contain an MSYS2 bash"; exit 1; }
          fi
          PATH="${MSYS_FIRST:+$MSYS_FIRST:}$PATH" "$RBIN" --no-echo --no-restore --vanilla -e '
            # simex 1.8 (Round 41, MR-Egger with SIMEX correction): CRAN source file, checked by SHA-256 before installing
            sx <- Sys.getenv("PK_SIMEX")
            if (!file.exists(sx) || !identical(digest::digest(file = sx, algo = "sha256"), "80c7841196b9377a9367eb6960ad80ca0bf8de511b8b18a0031bfbe7bde289a0"))
              stop("simex 1.8 source could not be downloaded or its checksum differs")
            install.packages(sx, repos = NULL, type = "source", INSTALL_opts = c("--no-docs", "--no-multiarch", "--no-test-load"))
            p <- Sys.getenv(c("PK_MRMIX", "PK_MRPRESSO", "PK_RADIALMR", "PK_MRRAPS", "PK_TWOSAMPLEMR"))   # dependency order
            install.packages(unname(p), repos = NULL, type = "source",
                             INSTALL_opts = c("--no-docs", "--no-multiarch", "--no-test-load"))
            for (n in c("simex", "MRMix", "MRPRESSO", "RadialMR", "mr.raps", "TwoSampleMR")) {
              if (!requireNamespace(n, quietly = TRUE)) stop("package did not install: ", n)
              cat(sprintf("%-12s %s\n", n, as.character(utils::packageVersion(n))))
            }
            # Round 64: GenomicSEM (with simsalapar, checked by SHA-256) and MRcML, Round 65: lhcMR; pure R and required.
            if (!requireNamespace("mixtools", quietly = TRUE)) {   # Round 65: macOS arm64, CRAN source checked by SHA-256
              mx <- Sys.getenv("PK_MIXTOOLS")
              if (!file.exists(mx) || !identical(digest::digest(file = mx, algo = "sha256"), "9aa341d85e418d481105da267f92a3def4504f7c143583617770c5d6aa8c97c1"))
                stop("mixtools 2.0.0.1 source could not be downloaded or its checksum differs")
              install.packages(mx, repos = NULL, type = "source", INSTALL_opts = c("--no-docs", "--no-multiarch"))
            }
            ss <- Sys.getenv("PK_SIMSALAPAR")
            if (!file.exists(ss) || !identical(digest::digest(file = ss, algo = "sha256"), "738704c61016276f1a01e0764a525ec9e5b0743003dfdf53487822a6ba881c6f"))
              stop("simsalapar 1.0-13 source could not be downloaded or its checksum differs")
            install.packages(c(ss, Sys.getenv(c("PK_GENOMICSEM", "PK_MRCML", "PK_LHCMR", "PK_MRLAP", "PK_MRAPSS"))), repos = NULL, type = "source", INSTALL_opts = c("--no-docs", "--no-multiarch", "--no-test-load"))
            for (n in c("mixtools", "simsalapar", "GenomicSEM", "MRcML", "lhcMR", "MRlap", "MRAPSS")) { if (!requireNamespace(n, quietly = TRUE)) stop("package did not install: ", n); cat(sprintf("%-12s %s\n", n, as.character(utils::packageVersion(n)))) }
            # MRCD is compiled (C++ and LAPACK); where the runner cannot build it, the app reports that BiDirectCausal is not installed.
            mk <- file.path(tempdir(), "Makevars"); writeLines("FLIBS=", mk); Sys.setenv(R_MAKEVARS_USER = mk)
            tryCatch(install.packages(unname(Sys.getenv(c("PK_MRCD", "PK_BIDIRECTCAUSAL"))), repos = NULL, type = "source", INSTALL_opts = c("--no-docs", "--no-multiarch")), error = function(e) message("optional: ", conditionMessage(e)))
            for (n in c("MRCD", "BiDirectCausal")) cat(sprintf("%-12s %s\n", n, if (requireNamespace(n, quietly = TRUE)) as.character(utils::packageVersion(n)) else "NOT INSTALLED (optional)"))
            # Round 70: CAUSE is compiled (Rcpp, RcppParallel); where the runner cannot build it, the app reports that cause is not installed.
            if (utils::packageVersion("loo") != "2.8.0") stop("CAUSE needs loo 2.8.0 (runtime.yml), found ", utils::packageVersion("loo"))
            tryCatch(install.packages(Sys.getenv("PK_CAUSE"), repos = NULL, type = "source", INSTALL_opts = c("--no-docs", "--no-multiarch")), error = function(e) message("optional: ", conditionMessage(e)))
            cat(sprintf("%-12s %s\n", "cause", if (requireNamespace("cause", quietly = TRUE)) as.character(utils::packageVersion("cause")) else "NOT INSTALLED (optional)"))'
          {
            for d in twosamplemr mrmix mrpresso radialmr genomicsem mrcml mrcd bidirectcausal lhcmr mrlap mrapss cause; do echo "$d $(git -C "_pinned/$d" rev-parse HEAD)"; done
          } > "package-lock-${{ matrix.id }}.txt"
          cat "package-lock-${{ matrix.id }}.txt"
          du -sh prototype/runtime | tee "size-${{ matrix.id }}.txt"

      - name: Size breakdown and safe trimming of the runtime
        run: |
          RT=prototype/runtime
          {
            echo "== runtime before trimming: $(du -sm $RT | cut -f1) MB"
            echo "== largest folders (MB), depth 3"
            du -m -d 3 $RT | sort -rn | head -40
          } > "size-breakdown-${{ matrix.id }}.txt"
          # Remove only what the app never uses at run time: package vignettes, tests, examples,
          # demos and html help, header files and manual pages. Package help indexes stay.
          find $RT \( -path '*/library/*/doc' -o -path '*/library/*/tests' -o -path '*/library/*/html' \
            -o -path '*/library/*/examples' -o -path '*/library/*/demo' -o -path '*/share/doc' \
            -o -path '*/share/man' -o -path '*/R/doc' -o -path "$RT/include" -o -path "$RT/man" \) \
            -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find $RT -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          # macOS only: the conda R pulls in a C, C++ and Fortran compiler toolchain. The app never compiles
          # anything (every package is already installed), so these folders are dead weight:
          # libexec/gcc (compiler passes), lib/clang (compiler headers) and lib/gcc (compile-time libraries).
          # Runtime libraries such as libgfortran and libomp live directly in lib/ and stay.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            rm -rf "$RT/libexec/gcc" "$RT/lib/clang" "$RT/lib/gcc"
            rmdir "$RT/libexec" 2>/dev/null || true
            # compiler and LLVM command-line programs in bin (prefixed compilers, llvm-*, clang*, gfortran)
            rm -f "$RT"/bin/llvm-* "$RT"/bin/clang* "$RT"/bin/*-apple-darwin*-* "$RT"/bin/gfortran "$RT"/bin/lld* "$RT"/bin/ld64* 2>/dev/null || true
            rm -f "$RT"/bin/dsymutil-* "$RT"/bin/opt-* "$RT"/bin/llc-* "$RT"/bin/lli-* "$RT"/bin/llubi-* "$RT"/bin/sancov-* 2>/dev/null || true
            # LLVM and clang libraries: only the removed compiler needed them (about 260 MB)
            rm -f "$RT"/lib/libLLVM* "$RT"/lib/libclang* "$RT"/lib/libLTO* "$RT"/lib/libRemarks* 2>/dev/null || true
            # static libraries are only for linking, not for running
            find "$RT/lib" -maxdepth 1 -name '*.a' -type f -exec rm -f {} + 2>/dev/null || true
            # report anything that still links to the removed libraries (contract tests are the real gate)
            find "$RT" -type f \( -name '*.dylib' -o -name '*.so' \) -exec sh -c 'otool -L "$1" 2>/dev/null | grep -Eq "libLLVM|libclang|libLTO" && echo "STILL LINKS LLVM: $1"' _ {} \; || true
          fi
          # debug symbol files (not needed to run anything)
          find $RT -name '*.pdb' -type f -exec rm -f {} + 2>/dev/null || true
          # Windows: the same kind of toolchain sits under Library/. Compiler passes, compile-time libraries
          # and the compiler's own sysroot are not on the PATH that R uses (Library/bin, Library/mingw-w64/bin,
          # Library/usr/bin), so they are not needed to run R. Runtime DLLs stay where they are.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            rm -rf "$RT/Library/libexec/gcc" "$RT/Library/lib/gcc" "$RT/Library/x86_64-w64-mingw32"
            rmdir "$RT/Library/libexec" 2>/dev/null || true
          fi
          for B in "$RT/bin" "$RT/lib" "$RT/Library/bin" "$RT/Library/lib"; do
            [ -d "$B" ] && { echo "== largest files in $B (MB)"; ls -lS "$B" 2>/dev/null | head -25 | awk '{printf "%7.1f  %s\n", $5/1048576, $9}'; } >> "size-breakdown-${{ matrix.id }}.txt"
          done
          # Trimming can leave shortcuts (symbolic links) that point at deleted files, for example
          # lib/clang/*/include/omp.h -> include/omp.h. The installer builder stops on those, so remove them.
          # (find -L lists only broken links when combined with -type l; works with GNU and BSD find.)
          echo "== broken links removed: $(find -L $RT -type l 2>/dev/null | wc -l)" | tee -a "size-breakdown-${{ matrix.id }}.txt"
          find -L $RT -type l -exec rm -f {} + 2>/dev/null || true
          echo "== runtime after trimming: $(du -sm $RT | cut -f1) MB" | tee -a "size-breakdown-${{ matrix.id }}.txt"
          cat "size-breakdown-${{ matrix.id }}.txt"

      - name: Bundle PLINK 1.9 (pinned official build, checksum checked)
        # Pins must match PLINK_PIN in prototype/engine/ld_core.R. PLINK is GPL-3: its LICENSE is shipped next to the program.
        run: |
          case "$RUNNER_OS" in
            macOS)   PZ=plink_mac_20260927.zip;          PS=927ecadbefb3e0ceefbe4978d71bf63566e9ea422d6595c2ee23a83ad76eeb62; PB=plink ;;
            Windows) PZ=plink_win64_20260927.zip;        PS=625538e0062eb9fad6c26a47c9f36b19d3ec0afe5053ec68ff5ff877a56676c6; PB=plink.exe ;;
            *)       PZ=plink_linux_x86_64_20260927.zip; PS=ee4d8616dc64c04ed395e81a7bb04f9b3d92e4bf23d12a8b6233b19f7227eccd; PB=plink ;;
          esac
          curl -sfL --retry 3 -o "$RUNNER_TEMP/$PZ" "https://s3.amazonaws.com/plink1-assets/$PZ"
          python - "$RUNNER_TEMP/$PZ" "$PS" "$PB" <<'PY'
          import hashlib, sys, zipfile, os
          z, want, binname = sys.argv[1], sys.argv[2], sys.argv[3]
          got = hashlib.sha256(open(z, "rb").read()).hexdigest()
          if got != want:
              sys.exit(f"PLINK archive checksum differs: {got} (expected {want})")
          out = os.path.join("prototype", "engine", "tools", "plink")
          os.makedirs(out, exist_ok=True)
          with zipfile.ZipFile(z) as f:
              for name in (binname, "LICENSE"):
                  open(os.path.join(out, name), "wb").write(f.read(name))
          os.chmod(os.path.join(out, binname), 0o755)
          print("PLINK checksum ok:", got)
          PY
          if [[ "$RUNNER_OS" == "macOS" ]]; then codesign --force --sign - prototype/engine/tools/plink/plink; fi   # Apple Silicon runs only signed code; ad hoc is enough
          prototype/engine/tools/plink/$PB --version

      - name: Contract tests with the moved runtime
        run: |
          cd contracts
          "$RBIN" --no-echo --no-restore --vanilla --file=r/tests/test_contracts.R --args "$CTDIR"
          mkdir -p "$GITHUB_WORKSPACE/results-${{ matrix.id }}"
          cp "$CTDIR"/run-*/result_*.json "$GITHUB_WORKSPACE/results-${{ matrix.id }}/"

      - name: Study database write speed with synchronous=FULL (information only)
        continue-on-error: true
        run: |
          cd contracts
          "$RBIN" --no-echo --no-restore --vanilla --file=../validation/storage/sqlite_throughput.R --args 500

      - name: Connection gate tests (contracts C10)
        run: |
          python -m pip install --quiet websockets
          MRGUI_R_CMD="$RBIN|--no-echo|--no-restore|--vanilla" python prototype/engine/test_gate.py

      - name: Real https request to OpenGWAS with the moved runtime
        run: |
          # The runtime was built in another folder; its libcurl remembers that folder's certificate file.
          # This step fails the build if a verified https call does not work from the moved runtime.
          "$RBIN" --no-echo --no-restore --vanilla --file=prototype/ci/https_check.R

      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Build installers
        working-directory: prototype/shell
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npx --yes @tauri-apps/cli@2 build --bundles app
            # Tauri's own dmg step hangs on CI runners (hdiutil detach timeout), so pack the app ourselves.
            mkdir -p target/release/bundle/dmg
            VER="$(python3 -c "import json;print(json.load(open('tauri.conf.json'))['version'])")"
            ARCH="$([[ "$(uname -m)" == "arm64" ]] && echo aarch64 || echo x64)"
            DMG="target/release/bundle/dmg/MR Studio_${VER}_${ARCH}.dmg"
            STAGE="$RUNNER_TEMP/dmgstage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
            cp -R "target/release/bundle/macos/MR Studio.app" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            for i in 1 2 3; do
              hdiutil create -volname "MR Studio" -srcfolder "$STAGE" -ov -format UDZO "$DMG" && break
              echo "hdiutil attempt $i failed, retrying"; sleep 10
            done
            ls -la target/release/bundle/dmg
          else
            npx --yes @tauri-apps/cli@2 build
          fi

      - name: Smoke-test the bundled app
        run: |
          export MRGUI_SMOKE=1
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            APP="prototype/shell/target/release/bundle/macos/MR Studio.app/Contents/MacOS/mr-studio"
            "$APP"
            sleep 3
            if pgrep -f "bin/exec/R" >/dev/null; then echo "engine left running"; exit 1; fi
          else
            INSTALLER="$(ls prototype/shell/target/release/bundle/nsis/*.exe | head -1)"
            powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$INSTALLER")' -ArgumentList '/S'"
            powershell -NoProfile -Command '
              $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter "mr-studio.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $exe) { Write-Error "installed app not found"; exit 1 }
              $p = Start-Process -FilePath $exe.FullName -Wait -PassThru
              Start-Sleep -Seconds 3
              if (Get-Process -Name Rterm -ErrorAction SilentlyContinue) { Write-Error "engine left running"; exit 1 }
              exit $p.ExitCode'
          fi

      - name: Script generation, replay and study folder tests (contracts v1.1)
        run: |
          cd contracts
          set +e
          "$RBIN" --no-echo --no-restore --vanilla --file=r/tests/test_scripts.R --args "$CTDIR"
          RC=$?
          "$RBIN" --no-echo --no-restore --vanilla --file=r/tests/test_study.R --args "$CTDIR"
          RC2=$?
          if [[ $RC2 -ne 0 ]]; then RC=$RC2; fi
          mkdir -p "$GITHUB_WORKSPACE/results-${{ matrix.id }}/script-pair"
          cp -R "$CTDIR"/run11-*/P01_pair/. "$GITHUB_WORKSPACE/results-${{ matrix.id }}/script-pair/" || true
          exit $RC

      - name: Screen logic and server tests (study, pair, run, results)
        run: |
          "$RBIN" --no-echo --no-restore --vanilla --file=prototype/engine/test_studio.R

      - name: Collect installer sizes
        if: always()
        run: |
          find prototype/shell/target/release/bundle \( -name "*.dmg" -o -name "*.exe" \) -exec du -h {} \; | tee -a "size-${{ matrix.id }}.txt" || true

      - name: Attach the installer to the run's pre-release
        if: always()
        run: |
          shopt -s nullglob
          FILES=(prototype/shell/target/release/bundle/dmg/*.dmg prototype/shell/target/release/bundle/nsis/*.exe)
          if [[ ${#FILES[@]} -eq 0 ]]; then echo "no installer was built"; exit 0; fi
          # One name per system, so the file says which computer it is for.
          for F in "${FILES[@]}"; do
            EXT="${F##*.}"; mkdir -p upload; OUT="upload/MR-Studio-${{ matrix.id }}.$EXT"
            cp "$F" "$OUT"
            gh release upload "$REL_TAG" "$OUT" -R "$GITHUB_REPOSITORY" --clobber
          done

      - name: Attach the test report to the run's pre-release
        if: always()
        run: |
          shopt -s nullglob
          ITEMS=(results-${{ matrix.id }} runtime-lock-${{ matrix.id }}.txt package-lock-${{ matrix.id }}.txt size-breakdown-${{ matrix.id }}.txt size-${{ matrix.id }}.txt)
          KEEP=(); for I in "${ITEMS[@]}"; do [[ -e "$I" ]] && KEEP+=("$I"); done
          if [[ ${#KEEP[@]} -eq 0 ]]; then echo "no report files"; exit 0; fi
          python -m zipfile -c "report-${{ matrix.id }}.zip" "${KEEP[@]}"
          gh release upload "$REL_TAG" "report-${{ matrix.id }}.zip" -R "$GITHUB_REPOSITORY" --clobber

  cross-os:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the test reports from the run's pre-release
        run: |
          mkdir -p reports
          gh release download "$REL_TAG" -R "$GITHUB_REPOSITORY" -p 'report-*.zip' -D reports
          for Z in reports/report-*.zip; do
            D="reports/$(basename "$Z" .zip)"; mkdir -p "$D"; python3 -m zipfile -e "$Z" "$D"; rm "$Z"
          done
          find reports -maxdepth 2 | sort
      - name: Compare estimates across operating systems (tolerance 1e-8)
        run: python3 prototype/ci/compare_results.py reports
      - name: Compare generated scripts and their results across operating systems
        run: python3 prototype/ci/compare_scripts.py reports
