# Bundled R runtime for the week-1 prototype (conda-forge).
# R 4.5 rather than 4.6: on 2026-10-29 several R packages (e.g. r-dbi) had no
# conda-forge build for R 4.6 yet. The exact resolved versions are saved by the
# pipeline as runtime-lock-<os>.txt and become the pinned lock for v1.
name: mrgui-runtime
channels:
  - conda-forge
dependencies:
  - r-base=4.5
  - r-shiny
  - r-httpuv
  - r-later
  - r-jsonlite
  - r-digest
  - r-dbi
  - r-rsqlite
  # Data library tables are Parquet files (Round 35): small, dependency-free reader and writer.
  - r-nanoparquet
  # Excel import (Round 77): .xlsx and .xls GWAS tables, for example supplementary tables of papers (MIT).
  - r-readxl
  # PDF report (Round 46): figures are placed in the PDF from their PNG files.
  - r-png
  # Debiased IVW (Round 37): MendelianRandomization::mr_divw.
  - r-mendelianrandomization
  # MVMR Q-minimisation (Round 54): bootstrap BCa intervals with boot, as MVMR::qhet_mvmr.
  - r-boot=1.3_32
  # Imports of mr.raps (Round 38; mr.raps itself is installed from a pinned commit, see prototype.yml).
  # Its rsnps import is removed before installing (prototype/ci/patch_mrraps.py): rsnps has no osx-arm64 build.
  - r-nortest
  - r-rootsolve
  - r-ggrepel
  # Dependencies of TwoSampleMR (contracts v1.1: the generated scripts call it directly).
  # TwoSampleMR itself and its three GitHub-only imports (MRMix, MRPRESSO, RadialMR)
  # are installed by the pipeline from pinned commits, see prototype.yml.
  - r-cli
  - r-cowplot
  - r-data.table
  - r-dplyr
  - r-ggplot2
  - r-glmnet
  - r-gridextra
  - r-gtable
  - r-ieugwasr
  - r-knitr
  - r-lattice
  - r-magrittr
  - r-mass
  - r-pbapply
  - r-plotly
  - r-psych
  - r-rmarkdown
  - r-tidyr
  # LD score regression (Round 64): imports of GenomicSEM, which is installed from a pinned commit (prototype.yml);
  # its import simsalapar is not on conda-forge and is installed from its CRAN source, checked by SHA-256.
  - r-e1071
  - r-readr
  - r-gdata
  - r-lavaan
  - r-doparallel
  - r-foreach
  - r-stringr
  - r-splitstackshape
  - r-r.utils
  - r-iterators
  - r-rcpp
  # mgsub 1.7.3: pure R. The conda-forge 2.0.0 build is marked noarch but holds a compiled library that loads on no platform (run 44481927955).
  - r-mgsub=1.7.3
  - r-sfsmisc
  - r-gridbase
  - r-colorspace
  # Bidirectional MR-cML (Round 63): MRCD imports pracma (and Rcpp, above).
  - r-pracma
  # LHC-MR (Round 65): imports of lhcMR, which is installed from a pinned commit (prototype.yml), and of its import mixtools.
  # mixtools itself has no conda-forge build for macOS arm64: prototype.yml adds r-mixtools on the other systems and builds
  # it from its CRAN source (checked by SHA-256) on macOS arm64 (run 44485221147).
  - r-rslurm
  - r-kernlab
  - r-segmented
  - r-scales
  - r-survival
  # MR-APSS (Round 69): imports of MRAPSS, which is installed from a pinned commit (prototype.yml).
  - r-ggnewscale
  - r-expm
  # CAUSE (Round 70): imports of cause, which is installed from a pinned commit (prototype.yml) and compiled (Rcpp, RcppParallel).
  # loo 2.8.0: from loo 2.10 loo_compare() returns a model-name column first, which cause reads as the ELPD difference
  # ("non-numeric argument to binary operator" in in_sample_elpd_loo); 2.8.0 is the last version with the shape cause expects.
  - r-loo=2.8.0
  - r-rcppparallel
  - r-mixsqp
  - r-numderiv
  - r-ashr
  - r-purrr
  - r-intervals
  - r-matrixstats
